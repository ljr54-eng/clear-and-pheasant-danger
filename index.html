<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171e18"><meta name="apple-mobile-web-app-capable" content="yes"><title>Clear and Pheasant Danger 2026</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzxZJsNwQlKqgLJ7rZ4V+o2aJ8=" crossorigin=""><style>#update-banner{position:sticky;top:0;z-index:100;background:#f4c64d;color:#24210f;padding:11px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;font:700 13px system-ui,sans-serif;box-shadow:0 3px 12px #0005}#update-banner button{background:#24210f;color:#fff;border:0;border-radius:7px;padding:9px 12px;font:700 12px system-ui,sans-serif}#update-banner.visible{display:flex}</style></head><body><div id="update-banner" role="status" aria-live="polite"><span>🟡 Update available — a new version is ready!</span><button id="update-restart" type="button">Restart app</button></div><header><div class="brand"><span class="crest">♛</span><div><small>SOUTH DAKOTA · 2026</small><strong>CLEAR AND PHEASANT DANGER 2026</strong></div></div><button id="sync" class="tiny">LOCAL MODE</button></header><main id="app"></main><nav id="nav"><button data-tab="board" class="active">🏆<span>Standings</span></button><button data-tab="log">🎯<span>Log</span></button><button data-tab="cards">🃏<span>Cards</span></button><button data-tab="map">📍<span>Map</span></button><button data-tab="quotes">💬<span>Quotes</span></button><button data-tab="chronicle">📜<span>Report</span></button></nav><dialog id="modal"><form method="dialog"><button class="close" aria-label="Close">×</button><div id="modal-body"></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.84.0/dist/umd/supabase.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script type="module" src="app.js"></script><script defer src="bird-alerts.js"></script><script>
(()=>{const banner=document.getElementById('update-banner');const restart=document.getElementById('update-restart');let baseline=null;let checking=false;async function check(){if(checking||!navigator.onLine)return;checking=true;try{const r=await fetch('app.js?update-check='+Date.now(),{method:'HEAD',cache:'no-store'});if(!r.ok)return;const version=r.headers.get('etag')||r.headers.get('last-modified');if(!version)return;if(baseline===null)baseline=version;else if(version!==baseline)banner.classList.add('visible')}catch(e){console.debug('Update check unavailable',e)}finally{checking=false}}restart.addEventListener('click',()=>{const url=new URL(location.href);url.searchParams.set('updated',Date.now().toString());location.replace(url.toString())});document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});window.addEventListener('online',check);check();setInterval(()=>{if(!document.hidden)check()},60000)})();
</script></body></html>
